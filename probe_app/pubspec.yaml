    sdk: flutter
  flutter_web_auth_2: ^4.1.0      # ASWebAuthenticationSession (iOS/macOS), Custom Tabs (Android)
  http: ^1.2.2
  crypto: ^3.0.5
  shared_preferences: ^2.3.2

flutter:
  uses-material-design: true
