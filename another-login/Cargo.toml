[package]
name = "another-login"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "cookies", "form", "query", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.53.3", features = ["full"] }
url = "2.5.8"
webbrowser = "1.2.4"
